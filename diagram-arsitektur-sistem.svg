<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Inter, Arial, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0e7490"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Arsitektur Sistem — MODIS Volcano Monitor</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#64748b">Alur data mengalir dari atas ke bawah. Pengguna berinteraksi hanya melalui Dashboard.</text>

  <text x="86" y="132" font-size="11" font-weight="700" letter-spacing="1.5" fill="#10b981">SUMBER DATA</text>
  <text x="86" y="372" font-size="11" font-weight="700" letter-spacing="1.5" fill="#3b82f6">BACKEND</text>
  <text x="86" y="648" font-size="11" font-weight="700" letter-spacing="1.5" fill="#16a34a">FRONTEND</text>

  <line x1="600" y1="166" x2="600" y2="204" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="274" x2="600" y2="314" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="384" x2="600" y2="424" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="514" x2="600" y2="566" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="430" y="96" width="340" height="70" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">1 · MODVOLC (HIGP, Hawaii)</text>
  <text x="600" y="147" text-anchor="middle" font-size="11" fill="#475569">Data anomali termal hotspot dari satelit (NASA)</text>

  <rect x="430" y="204" width="340" height="70" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="600" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">2 · Python Collector (worker)</text>
  <text x="600" y="255" text-anchor="middle" font-size="11" fill="#475569">Mengambil data berkala &amp; menghitung laju lava (Harris 2007)</text>

  <rect x="430" y="314" width="340" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="600" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">3 · MySQL (database)</text>
  <text x="600" y="365" text-anchor="middle" font-size="11" fill="#475569">modis_data · lava_volume_calculations · collection_runs</text>

  <rect x="430" y="424" width="340" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">4 · Flask REST API</text>
  <text x="600" y="478" text-anchor="middle" font-size="11" fill="#475569">Melayani semua permintaan data dashboard</text>
  <text x="600" y="497" text-anchor="middle" font-size="11" fill="#475569">Membaca DEM lewat DEM Reader (rasterio)</text>

  <rect x="860" y="448" width="220" height="58" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="970" y="475" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">File DEM GeoTIFF</text>
  <text x="970" y="494" text-anchor="middle" font-size="10" fill="#475569">peta ketinggian · raster</text>
  <line x1="860" y1="477" x2="794" y2="477" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="827" y="468" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">DEM Reader</text>

  <rect x="390" y="566" width="420" height="58" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="596" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">5 · React Dashboard</text>
  <text x="600" y="615" text-anchor="middle" font-size="11" fill="#475569">Tampilan web yang dilihat pengguna (aplikasi React + Vite)</text>

  <path d="M600 624 C600 650, 415 648, 415 678" stroke="#0e7490" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 624 C600 650, 785 648, 785 678" stroke="#0e7490" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="235" y="678" width="360" height="112" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="415" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Dashboard (utama)</text>
  <text x="415" y="726" text-anchor="middle" font-size="11" fill="#475569">3D DEM &amp; Hotspot · Data MODIS + CSV</text>
  <text x="415" y="744" text-anchor="middle" font-size="11" fill="#475569">Grafik Analisis Anomali Termal</text>
  <text x="415" y="762" text-anchor="middle" font-size="11" fill="#475569">Detail perhitungan (tabel) — di dalam Dashboard</text>
  <text x="415" y="782" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#0e7490">/api/dashboard · /api/dem/&lt;gunung&gt; · /api/lava-volume</text>

  <rect x="605" y="678" width="360" height="112" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="785" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Monitoring</text>
  <text x="785" y="726" text-anchor="middle" font-size="11" fill="#475569">Status collector · data masuk</text>
  <text x="785" y="744" text-anchor="middle" font-size="11" fill="#475569">Riwayat pengambilan per gunung</text>
  <text x="785" y="782" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#0e7490">/api/dashboard</text>

  <text x="600" y="830" text-anchor="middle" font-size="12" font-weight="600" fill="#0e7490">Satelit → Kurir → Gudang → Pelayan → Layar</text>
  <text x="600" y="852" text-anchor="middle" font-size="10" fill="#64748b">Hasil perhitungan laju lava tampil di Dashboard dalam 2 bentuk: grafik Analisis Termal &amp; tabel Detail Perhitungan (sumber sama: lava_volume_calculations)</text>
  <text x="600" y="870" text-anchor="middle" font-size="10" fill="#94a3b8">Convex Hull dihitung backend · Triangulasi Delaunay dihitung frontend · Pengguna hanya melihat Dashboard</text>
</svg>